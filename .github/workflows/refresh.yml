name: Refresh data & deploy

on:
  schedule:
    # ~7 AM, 1 PM and 6 PM US Eastern (cron is UTC)
    - cron: "0 12 * * *"
    - cron: "0 18 * * *"
    - cron: "0 23 * * *"
  push:
    branches: [main]
    paths-ignore: ["docs/data/**"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build data
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_NFL_MARKETS: ${{ vars.ODDS_NFL_MARKETS || '' }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scripts/build_data.py
      - name: Build NHL data
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          NHL_MONTHLY_CAP: ${{ vars.NHL_MONTHLY_CAP || '60' }}
          ODDS_NFL_MARKETS: ${{ vars.ODDS_NFL_MARKETS || '' }}
        run: python scripts/build_nhl.py
      - name: Commit data
        run: |
          git config user.name "propscout-bot"
          git config user.email "propscout-bot@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then echo "No data changes"; else git commit -m "data: refresh $(date -u +'%Y-%m-%d %H:%M UTC')" && (git push || (git pull --rebase -X ours && git push)); fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
